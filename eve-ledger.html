<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trade Ledger — EVE Market Watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #0b0d12;
    --panel: #12161f;
    --panel-raised: #171c27;
    --line: #232a38;
    --line-soft: #1a2029;
    --text: #d8dee9;
    --text-dim: #7a8699;
    --text-faint: #4d5666;
    --amber: #e8a33d;
    --amber-dim: #6b5227;
    --cyan: #4dd8c4;
    --cyan-dim: #285852;
    --good: #5dd873;
    --bad: #e85d5d;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--void);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(232,163,61,0.05), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(77,216,196,0.05), transparent 40%);
    color: var(--text);
    font-family: 'Sora', sans-serif;
    min-height: 100vh;
  }

  .wrap {
    max-width: 880px;
    margin: 0 auto;
    padding: 40px 20px 80px;
  }

  header.top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-bottom: 1px solid var(--line);
    padding-bottom: 20px;
    margin-bottom: 28px;
    flex-wrap: wrap;
    gap: 10px;
  }

  header.top h1 {
    font-size: 22px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.2px;
  }
  header.top h1 span { color: var(--text-dim); font-weight: 400; }

  .station-picker {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .station-picker select {
    background: var(--panel);
    color: var(--cyan);
    border: 1px solid var(--line);
    padding: 5px 8px;
    font-family: inherit;
    font-size: 12px;
  }

  .auth-row {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 10px;
    margin-bottom: 18px;
  }
  .auth-status {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-faint);
  }
  .auth-status.on { color: var(--good); }
  #authBtn {
    background: none;
    border: 1px solid var(--line);
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 6px 12px;
    cursor: pointer;
  }
  #authBtn:hover { border-color: var(--amber-dim); color: var(--amber); }

  .add-row {
    display: flex;
    gap: 8px;
    margin-bottom: 32px;
  }
  .add-row input {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 11px 14px;
    font-family: 'Sora', sans-serif;
    font-size: 14px;
  }
  .add-row input:focus { outline: none; border-color: var(--cyan-dim); }
  .add-row button {
    background: var(--cyan-dim);
    color: #eafffb;
    border: 1px solid var(--cyan-dim);
    padding: 0 20px;
    font-family: 'Sora', sans-serif;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
  }
  .add-row button:hover { background: var(--cyan); color: #04241f; }
  .add-row button:disabled { opacity: 0.5; cursor: default; }

  .status-line {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-faint);
    margin: -22px 0 24px 2px;
    min-height: 16px;
  }
  .status-line.err { color: var(--bad); }

  .empty {
    border: 1px dashed var(--line);
    padding: 40px 20px;
    text-align: center;
    color: var(--text-dim);
    font-size: 14px;
  }

  .item {
    border-top: 1px solid var(--line-soft);
    padding: 18px 2px;
  }
  .item:last-child { border-bottom: 1px solid var(--line-soft); }

  .item-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .item-name { font-size: 15px; font-weight: 600; }
  .item-actions { display: flex; align-items: center; gap: 14px; }
  .item-actions button {
    background: none;
    border: none;
    color: var(--text-faint);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    cursor: pointer;
    padding: 4px;
  }
  .item-actions button:hover { color: var(--bad); }

  .compare {
    display: grid;
    grid-template-columns: 1fr 1fr auto;
    gap: 0 24px;
    margin-top: 14px;
    font-family: 'JetBrains Mono', monospace;
  }
  .col-label {
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  .col-label.amber { color: var(--amber); }
  .col-label.cyan { color: var(--cyan); }
  .stat-row { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0; }
  .stat-row .k { color: var(--text-faint); }
  .stat-row .v { color: var(--text); }

  .verdict {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-end;
    min-width: 120px;
    text-align: right;
  }
  .verdict .pct { font-size: 20px; font-weight: 600; }
  .verdict .pct.good { color: var(--good); }
  .verdict .pct.bad { color: var(--bad); }
  .verdict .note { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

  .loading-dots { color: var(--text-faint); font-size: 13px; }

  .refresh-all {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 8px;
  }
  .refresh-all button {
    background: none;
    border: 1px solid var(--line);
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 6px 12px;
    cursor: pointer;
  }
  .refresh-all button:hover { border-color: var(--cyan-dim); color: var(--cyan); }

  footer {
    margin-top: 40px;
    font-size: 11px;
    color: var(--text-faint);
    font-family: 'JetBrains Mono', monospace;
    line-height: 1.6;
  }

  @media (max-width: 560px) {
    .compare { grid-template-columns: 1fr 1fr; }
    .verdict { grid-column: 1 / -1; align-items: flex-start; text-align: left; margin-top: 8px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <h1>Trade Ledger <span>· station vs. Jita</span></h1>
    <div class="station-picker">
      <label for="stationSelect">watching</label>
      <select id="stationSelect"></select>
    </div>
  </header>

  <div class="auth-row">
    <div id="authStatus" class="auth-status">not connected</div>
    <button id="authBtn">Log in with EVE</button>
  </div>

  <div class="add-row" id="structureRow" style="display:none;">
    <input id="structureIdInput" type="text" placeholder="Structure ID — right-click it in-game and Copy Item ID" autocomplete="off">
    <button id="structureGoBtn">Watch</button>
  </div>

  <div class="add-row">
    <input id="itemInput" type="text" placeholder="Add an item — e.g. Republic Fleet Firetail" autocomplete="off">
    <button id="addBtn">Add</button>
  </div>
  <div class="status-line" id="statusLine"></div>

  <div class="refresh-all" id="refreshAllWrap" style="display:none;">
    <button id="refreshAllBtn">refresh all</button>
  </div>

  <div id="list"></div>

  <footer>
    Prices are lowest active sell order, station-only, read live from ESI (esitanquility). Stock is total remaining
    units across sell orders at that station. Nothing here is saved between visits — reload clears the ledger.
  </footer>

</div>

<script>
// ---- Fill these in after registering an app at developers.eveonline.com ----
// PKCE flow, no client secret needed. Redirect URI must exactly match what
// you registered, and must be the real URL this file is hosted at.
const CLIENT_ID = 'PASTE_YOUR_CLIENT_ID_HERE';
const REDIRECT_URI = window.location.origin + window.location.pathname;
const SCOPES = 'esi-markets.structure_markets.v1';
// -----------------------------------------------------------------------

const ESI = 'https://esi.evetech.net/latest';
const SSO = 'https://login.eveonline.com';
const JITA = { name: 'Jita IV - Moon 4', type: 'station', regionId: 10000002, stationId: 60003760 };

const STATIONS = [
  { key: 'amarr',  name: 'Amarr VIII (Oris)',      type: 'station', regionId: 10000043, stationId: 60008494 },
  { key: 'dodixie', name: 'Dodixie IX - Moon 20',   type: 'station', regionId: 10000032, stationId: 60011866 },
  { key: 'rens',   name: 'Rens VI - Moon 8',        type: 'station', regionId: 10000030, stationId: 60004588 },
  { key: 'hek',    name: 'Hek VIII - Moon 12',      type: 'station', regionId: 10000042, stationId: 60005686 },
  { key: 'custom', name: 'Custom structure (needs login)', type: 'structure' },
];

const stationSelect = document.getElementById('stationSelect');
STATIONS.forEach(s => {
  const opt = document.createElement('option');
  opt.value = s.key;
  opt.textContent = s.name;
  stationSelect.appendChild(opt);
});
let currentStation = STATIONS[0];
const structureRow = document.getElementById('structureRow');
const structureIdInput = document.getElementById('structureIdInput');
document.getElementById('structureGoBtn').addEventListener('click', () => {
  const id = parseInt(structureIdInput.value.trim(), 10);
  if (!id) { setStatus('Enter a numeric structure ID.', true); return; }
  currentStation = { key: 'custom', name: `Structure ${id}`, type: 'structure', structureId: id };
  refreshAll();
});

stationSelect.addEventListener('change', () => {
  const picked = STATIONS.find(s => s.key === stationSelect.value);
  if (picked.type === 'structure') {
    structureRow.style.display = 'flex';
    if (!auth.accessToken) setStatus('Log in with EVE first to read structure markets.', true);
  } else {
    structureRow.style.display = 'none';
    currentStation = picked;
    refreshAll();
  }
});

// ---------------- EVE SSO (PKCE) ----------------
const auth = { accessToken: null, refreshToken: null, expiresAt: 0, characterName: null };

function b64url(bytes) {
  return btoa(String.fromCharCode(...new Uint8Array(bytes)))
    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
async function sha256(str) {
  return await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
}
function randomString(len) {
  const arr = new Uint8Array(len);
  crypto.getRandomValues(arr);
  return b64url(arr.buffer).slice(0, len);
}

async function startLogin() {
  const verifier = randomString(64);
  const challenge = b64url(await sha256(verifier));
  sessionStorage.setItem('eve_pkce_verifier', verifier);
  const params = new URLSearchParams({
    response_type: 'code',
    redirect_uri: REDIRECT_URI,
    client_id: CLIENT_ID,
    scope: SCOPES,
    code_challenge: challenge,
    code_challenge_method: 'S256',
    state: randomString(16),
  });
  window.location.href = `${SSO}/v2/oauth/authorize/?${params.toString()}`;
}

async function completeLogin(code) {
  const verifier = sessionStorage.getItem('eve_pkce_verifier');
  const body = new URLSearchParams({
    grant_type: 'authorization_code',
    code,
    client_id: CLIENT_ID,
    code_verifier: verifier,
  });
  const res = await fetch(`${SSO}/v2/oauth/token`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: body.toString(),
  });
  if (!res.ok) throw new Error('Token exchange failed');
  const data = await res.json();
  applyToken(data);
  history.replaceState({}, '', REDIRECT_URI);
}

async function refreshAccessToken() {
  const body = new URLSearchParams({
    grant_type: 'refresh_token',
    refresh_token: auth.refreshToken,
    client_id: CLIENT_ID,
  });
  const res = await fetch(`${SSO}/v2/oauth/token`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: body.toString(),
  });
  if (!res.ok) throw new Error('Session expired — log in again');
  applyToken(await res.json());
}

function applyToken(data) {
  auth.accessToken = data.access_token;
  auth.refreshToken = data.refresh_token || auth.refreshToken;
  auth.expiresAt = Date.now() + (data.expires_in - 30) * 1000;
  try {
    const payload = JSON.parse(atob(data.access_token.split('.')[1]));
    auth.characterName = (payload.sub || '').split(':')[2] ? payload.name : payload.name;
  } catch (e) { auth.characterName = 'connected character'; }
  renderAuth();
}

async function ensureFreshToken() {
  if (!auth.accessToken) throw new Error('Not logged in');
  if (Date.now() >= auth.expiresAt) await refreshAccessToken();
  return auth.accessToken;
}

function renderAuth() {
  const statusEl = document.getElementById('authStatus');
  const btn = document.getElementById('authBtn');
  if (auth.accessToken) {
    statusEl.textContent = `connected as ${auth.characterName}`;
    statusEl.classList.add('on');
    btn.textContent = 'Log out';
  } else {
    statusEl.textContent = 'not connected';
    statusEl.classList.remove('on');
    btn.textContent = 'Log in with EVE';
  }
}

document.getElementById('authBtn').addEventListener('click', () => {
  if (auth.accessToken) {
    auth.accessToken = null; auth.refreshToken = null; auth.characterName = null;
    renderAuth();
  } else {
    if (CLIENT_ID === 'PASTE_YOUR_CLIENT_ID_HERE') {
      setStatus('Add your Client ID in the script before logging in — see the comment at the top of the file.', true);
      return;
    }
    startLogin();
  }
});

// Resume an SSO redirect, if this load is one
(function handleRedirect() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  if (code) {
    completeLogin(code).catch(() => setStatus('Login failed — try again.', true));
  }
})();

const itemInput = document.getElementById('addBtn') && document.getElementById('itemInput');
const addBtn = document.getElementById('addBtn');
const statusLine = document.getElementById('statusLine');
const listEl = document.getElementById('list');
const refreshAllWrap = document.getElementById('refreshAllWrap');
const refreshAllBtn = document.getElementById('refreshAllBtn');

// In-memory watchlist: { typeId, name, jita: stats|null, home: stats|null, loading: bool }
let watchlist = [];

function setStatus(msg, isErr) {
  statusLine.textContent = msg || '';
  statusLine.classList.toggle('err', !!isErr);
}

async function resolveTypeId(name) {
  const res = await fetch(`${ESI}/universe/ids/?datasource=tranquility`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify([name])
  });
  if (!res.ok) throw new Error('Name lookup failed');
  const data = await res.json();
  if (!data.inventory_types || !data.inventory_types.length) return null;
  return { typeId: data.inventory_types[0].id, name: data.inventory_types[0].name };
}

async function fetchAllOrderPages(url, headers) {
  const first = await fetch(url + '1', { headers });
  if (!first.ok) throw new Error(first.status === 403 ? 'No market access to that structure' : 'Market fetch failed');
  const pages = parseInt(first.headers.get('x-pages') || '1', 10);
  let all = await first.json();
  const cap = Math.min(pages, 20);
  if (cap > 1) {
    const rest = await Promise.all(
      Array.from({ length: cap - 1 }, (_, i) => fetch(url + (i + 2), { headers }).then(r => r.ok ? r.json() : []))
    );
    rest.forEach(r => { all = all.concat(r); });
  }
  return all;
}

function summarizeSellOrders(orders) {
  if (!orders.length) return { minPrice: null, stock: 0, orderCount: 0 };
  const minPrice = Math.min(...orders.map(o => o.price));
  const stock = orders.reduce((sum, o) => sum + o.volume_remain, 0);
  return { minPrice, stock, orderCount: orders.length };
}

// station: either { type:'station', regionId, stationId } or { type:'structure', structureId }
async function getStationStats(station, typeId) {
  if (station.type === 'structure') {
    const token = await ensureFreshToken();
    const url = `${ESI}/markets/structures/${station.structureId}/?datasource=tranquility&page=`;
    const orders = await fetchAllOrderPages(url, { Authorization: `Bearer ${token}` });
    const sells = orders.filter(o => !o.is_buy_order && o.type_id === typeId);
    return summarizeSellOrders(sells);
  }
  const url = `${ESI}/markets/${station.regionId}/orders/?datasource=tranquility&order_type=sell&type_id=${typeId}&page=`;
  const orders = await fetchAllOrderPages(url);
  const atStation = orders.filter(o => o.location_id === station.stationId);
  return summarizeSellOrders(atStation);
}

function fmtIsk(v) {
  if (v == null) return '—';
  return v.toLocaleString('en-US', { maximumFractionDigits: 2 }) + ' ISK';
}
function fmtNum(v) {
  if (v == null) return '—';
  return v.toLocaleString('en-US');
}

function render() {
  refreshAllWrap.style.display = watchlist.length ? 'flex' : 'none';
  if (!watchlist.length) {
    listEl.innerHTML = '<div class="empty">Nothing on the ledger yet. Add an item above to start comparing.</div>';
    return;
  }
  listEl.innerHTML = '';
  watchlist.forEach((entry, idx) => {
    const div = document.createElement('div');
    div.className = 'item';

    if (entry.loading) {
      div.innerHTML = `
        <div class="item-head">
          <div class="item-name">${entry.name}</div>
          <div class="item-actions"><button data-idx="${idx}" data-action="remove">remove</button></div>
        </div>
        <div class="loading-dots">reading market data…</div>
      `;
    } else if (entry.error) {
      div.innerHTML = `
        <div class="item-head">
          <div class="item-name">${entry.name}</div>
          <div class="item-actions">
            <button data-idx="${idx}" data-action="retry">retry</button>
            <button data-idx="${idx}" data-action="remove">remove</button>
          </div>
        </div>
        <div class="loading-dots" style="color:var(--bad)">${entry.error}</div>
      `;
    } else {
      const home = entry.home, jita = entry.jita;
      let pctHtml = '<span class="note">no data</span>';
      if (home.minPrice != null && jita.minPrice != null) {
        const diff = ((home.minPrice - jita.minPrice) / jita.minPrice) * 100;
        const cls = diff <= 0 ? 'good' : 'bad';
        const sign = diff > 0 ? '+' : '';
        pctHtml = `<div class="pct ${cls}">${sign}${diff.toFixed(1)}%</div><div class="note">vs. Jita low</div>`;
      }
      div.innerHTML = `
        <div class="item-head">
          <div class="item-name">${entry.name}</div>
          <div class="item-actions">
            <button data-idx="${idx}" data-action="refresh">refresh</button>
            <button data-idx="${idx}" data-action="remove">remove</button>
          </div>
        </div>
        <div class="compare">
          <div>
            <div class="col-label cyan">${currentStation.name}</div>
            <div class="stat-row"><span class="k">low sell</span><span class="v">${fmtIsk(home.minPrice)}</span></div>
            <div class="stat-row"><span class="k">stock</span><span class="v">${fmtNum(home.stock)}</span></div>
            <div class="stat-row"><span class="k">orders</span><span class="v">${fmtNum(home.orderCount)}</span></div>
          </div>
          <div>
            <div class="col-label amber">Jita</div>
            <div class="stat-row"><span class="k">low sell</span><span class="v">${fmtIsk(jita.minPrice)}</span></div>
            <div class="stat-row"><span class="k">stock</span><span class="v">${fmtNum(jita.stock)}</span></div>
            <div class="stat-row"><span class="k">orders</span><span class="v">${fmtNum(jita.orderCount)}</span></div>
          </div>
          <div class="verdict">${pctHtml}</div>
        </div>
      `;
    }
    listEl.appendChild(div);
  });
}

async function loadEntry(entry) {
  entry.loading = true;
  entry.error = null;
  render();
  try {
    const [home, jita] = await Promise.all([
      getStationStats(currentStation, entry.typeId),
      getStationStats(JITA, entry.typeId)
    ]);
    entry.home = home;
    entry.jita = jita;
  } catch (e) {
    entry.error = 'Could not load market data — try again.';
  } finally {
    entry.loading = false;
    render();
  }
}

function refreshAll() {
  watchlist.forEach(loadEntry);
}

addBtn.addEventListener('click', addItem);
itemInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') addItem(); });

async function addItem() {
  const raw = itemInput.value.trim();
  if (!raw) return;
  addBtn.disabled = true;
  setStatus('Looking up "' + raw + '"…');
  try {
    const resolved = await resolveTypeId(raw);
    if (!resolved) {
      setStatus(`No item found matching "${raw}". Check the exact in-game name.`, true);
      addBtn.disabled = false;
      return;
    }
    if (watchlist.some(w => w.typeId === resolved.typeId)) {
      setStatus(`${resolved.name} is already on the ledger.`, true);
      addBtn.disabled = false;
      return;
    }
    const entry = { typeId: resolved.typeId, name: resolved.name, loading: true, error: null, home: null, jita: null };
    watchlist.push(entry);
    itemInput.value = '';
    setStatus('');
    render();
    loadEntry(entry);
  } catch (e) {
    setStatus('Lookup failed — check your connection and try again.', true);
  } finally {
    addBtn.disabled = false;
  }
}

listEl.addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-action]');
  if (!btn) return;
  const idx = parseInt(btn.dataset.idx, 10);
  const action = btn.dataset.action;
  if (action === 'remove') {
    watchlist.splice(idx, 1);
    render();
  } else if (action === 'refresh' || action === 'retry') {
    loadEntry(watchlist[idx]);
  }
});

refreshAllBtn.addEventListener('click', refreshAll);

render();
</script>
</body>
</html>
